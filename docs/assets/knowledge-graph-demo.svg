<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Демонстрационная карта связей TaleWisp</title><desc id="desc">Вымышленная серия Стеклянный маяк: две книги, персонажи Мира и Лев, сцены, события, мир, стиль и иллюстрации. Настоящая база автора не использована.</desc>
