<text x="40" y="48" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="600" fill="#eef5ff">Связи, которые держат историю вместе</text>
<text x="40" y="78" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#94a9c1">Вымышленные данные · схема совместимого с Obsidian хранилища</text>
