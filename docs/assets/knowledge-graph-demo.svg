<g fill="#e5b475"><circle cx="185" cy="260" r="10"/><circle cx="1015" cy="260" r="10"/><circle cx="600" cy="470" r="12"/></g><g font-size="16" fill="#f3d2a5"><text x="185" y="297">Гавань · мир</text><text x="1015" y="297">Башня · место</text><text x="600" y="504">Хронология и знания</text></g>
