<circle cx="600" cy="268" r="20" fill="#73d7ff"/><text x="600" y="314" font-size="23" font-weight="600" fill="#eef7ff">Стеклянный маяк</text><text x="600" y="337" font-size="13" fill="#91abc6">серия · общий канон</text>
<g fill="#bda2ff"><circle cx="350" cy="195" r="12"/><circle cx="850" cy="195" r="12"/></g><g font-size="18" fill="#e9ddff"><text x="350" y="166">Книга 1 · Сигнал</text><text x="850" y="166">Книга 2 · Возвращение</text></g>
<circle cx="600" cy="145" r="10" fill="#91b7dc"/><text x="600" y="119" font-size="16" fill="#cbddf0">Источники и фрагменты</text>
