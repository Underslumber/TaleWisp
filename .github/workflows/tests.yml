name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # The StoryArt integration validates Windows paths, and the release tests call PowerShell.
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare neutral fixtures for files that are private to the author
        run: node web-client/scripts/prepare-test-fixtures.mjs
      - name: Build the living world module when the checkout has it
        if: hashFiles('scripts/setup-living-world.mjs') != ''
        run: node scripts/setup-living-world.mjs
      - name: Web client tests
        working-directory: web-client
        # The default TEMP on Windows runners is an 8.3 short path, which the path-safety checks treat as a link.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: node --test --test-timeout=120000 "tests/*.test.mjs" "newtests/*.test.mjs" "tests-ui/*.test.mjs" "tests-agent/*.test.mjs" "tests-google/*.test.mjs"
      - name: Plugin tests
        if: always()
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          python -m pip install --quiet pytest jsonschema
          python -m pytest -q -p no:cacheprovider tests
